# =============================================================================
# frontend / backend のビルドへ cacert.crt を build secret で渡すオーバーレイ
# ---------------------------------------------------------------------------
# 【何のためのファイルか】
#   社内標準ベースイメージ (EAP_BASE_IMAGE) は、BuildKit の build secret 経由で
#   「ビルドコンテキスト上の所定のディレクトリに置いた cacert.crt」を受け取り、
#   JVM のトラストストア (JDK 同梱 cacerts) と JBoss EAP (Elytron) の
#   トラストストアへ取り込んでいる。
#
#     RUN --mount=type=secret,id=cacert,target=/run/secrets/cacert.crt \
#         keytool -importcert ... -keystore "${JAVA_HOME}/lib/security/cacerts"
#
#   このオーバーレイは、その入力に **pki-init が出力した cacert.crt** を
#   そのまま流し込むための配線。docker/front/Dockerfile と docker/back/Dockerfile
#   にも同じ取り込み処理を実装してあるため、ベースイメージを差し替えなくても
#   「ビルド時取り込み」の経路をローカルでそのまま検証できる。
#
# 【なぜ compose.yaml 本体に入れていないか】
#   compose の secrets(file:) は、参照先ファイルが無いと build が失敗する。
#   cacert.crt は pki-init を起動して初めて出力されるため、本体に入れると
#   まっさらな clone での `docker compose up -d --build` が動かなくなる。
#   そこで「出力済みのときだけ使うオーバーレイ」として分離している。
#
# 【使い方】
#   1) まず PKI を配備して cacert.crt を出力させる (compose/pki/export/ に出る)
#        docker compose up -d pki-init
#        ls compose/pki/export/          # cacert.crt があることを確認
#        (受領済みの cacert.crt を使う場合は先に compose/pki/provided/ へ置く)
#
#   2) build secret 付きでビルドする
#        docker compose -f compose.yaml -f compose.build-secret.yaml build frontend backend
#        docker compose -f compose.yaml -f compose.build-secret.yaml up -d
#
#   3) 取り込まれたことを確認する
#        docker compose logs frontend | grep 'truststore\[build\]'
#        docker compose exec frontend cat /opt/pki/build-import.txt
#        ./verify-tls.sh
#
#   別のファイルを渡したい場合は .env の PKI_BUILD_SECRET_FILE でホストパスを指定する。
#
# 【素の docker build で同じことをする場合】
#   docker build --secret id=cacert,src=compose/pki/export/cacert.crt \
#                --build-arg EAP_BASE_IMAGE=... -f front/Dockerfile ./docker
#
# 【秘密の扱い】
#   --mount=type=secret はビルド中だけ tmpfs にマウントされ、イメージのレイヤーにも
#   ビルドキャッシュにも残らない。cacert.crt 自体は公開してよい証明書 (公開鍵) だが、
#   ベースイメージと同じ渡し方をそろえるためにこの方式にしている。
# =============================================================================

services:
  frontend:
    build:
      secrets:
        - cacert

  backend:
    build:
      secrets:
        - cacert

secrets:
  # 既定は pki-init の出力先。.env の PKI_BUILD_SECRET_FILE で差し替えられる
  # (例: 受領物をそのまま渡す → PKI_BUILD_SECRET_FILE=./compose/pki/provided/cacert.crt)
  cacert:
    file: ${PKI_BUILD_SECRET_FILE:-./compose/pki/export/cacert.crt}
