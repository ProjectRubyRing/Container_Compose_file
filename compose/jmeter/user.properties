# =============================================================================
# user.properties — JMeter の実行時設定 (★差し替え可能★)
# ---------------------------------------------------------------------------
# jmeter-run が `jmeter -q /etc/jmeter/user.properties` として読み込む。
# JMeter 同梱の bin/jmeter.properties を上書きする位置づけで、ここには
# 「性能試験のたびに効いてくる設定」だけを、意味と推奨値つきで書いている。
#
# 変更の反映: このファイルはコンテナへ読み取り専用でマウントしているだけなので、
#             ホスト側 (compose/jmeter/user.properties) を編集して次の実行から有効。
#             イメージの再ビルドは不要。
#
# 個別の実行だけ値を変えたいときは、コマンドラインの -J で上書きする:
#   docker compose --profile loadtest run --rm jmeter run plan.jmx -- -Jsummariser.interval=10
#
# 各項目のさらに詳しい解説と推奨値の根拠: docs/JMETER-LOADTEST.md
#                                        docs/JMETER-SETTINGS.xlsx
# 注意: このファイルは Java の Properties 形式 (ISO-8859-1) として読まれる。
#       日本語は「# で始まるコメント」だけに書き、値には ASCII しか書かないこと。
# =============================================================================


# =============================================================================
# 1. 結果ファイル (jtl) に保存する項目
# ---------------------------------------------------------------------------
# ここが性能試験の品質を一番左右する。保存項目を増やすと後から追える情報が
# 増える代わりに、ファイルが膨らみ、ディスク I/O が負荷生成の足を引っ張る。
# 既定は「CSV + 解析に必要な項目だけ」。応答本文が要るときだけ XML に切り替える
# (JMETER_RESULTS_FORMAT=xml。ただし HTML ダッシュボードは生成できなくなる)。
# =============================================================================

# 出力形式。csv = 1 行 1 サンプル (推奨)。xml = 応答の中身まで保存できるが肥大化する。
# jmeter-run が JMETER_RESULTS_FORMAT の値で -J 上書きする。
jmeter.save.saveservice.output_format=csv

# 1 行目にヘッダ (timeStamp,elapsed,label,...) を出す。
# GUI のリスナーと HTML ダッシュボードの両方がこのヘッダで列を解釈するため true 必須。
jmeter.save.saveservice.print_field_names=true

# --- 解析に必須の項目 (HTML ダッシュボード生成の前提でもある) ----------------
# 開始時刻 (epoch ミリ秒)。時系列グラフの X 軸になる
jmeter.save.saveservice.time=true
jmeter.save.saveservice.timestamp_format=ms
# 応答時間 (elapsed)。最重要指標
jmeter.save.saveservice.label=true
jmeter.save.saveservice.response_code=true
jmeter.save.saveservice.response_message=true
jmeter.save.saveservice.successful=true
jmeter.save.saveservice.thread_name=true
jmeter.save.saveservice.data_type=true
# 実行中のスレッド数 (grpThreads / allThreads)。
# 「どの負荷レベルで応答が伸びたか」を後から突き合わせるのに要る
jmeter.save.saveservice.thread_counts=true
# 送受信バイト数。帯域が頭打ちかどうかの判断に使う (ダッシュボードも参照する)
jmeter.save.saveservice.bytes=true
# 最初の 1 バイトが返るまで (latency) と TCP 接続確立まで (connect)。
# elapsed - latency = 応答本文の転送時間、connect の増加 = コネクション枯渇の兆候
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true
# 実際に叩いた URL。リダイレクトやパラメータ込みの追跡に使う
jmeter.save.saveservice.url=true
# アサーション結果 (成功/失敗の理由)。失敗の切り分けに要る
jmeter.save.saveservice.assertion_results_failure_message=true

# --- 既定では保存しない項目 (必要なときだけ true) ---------------------------
# 応答本文。XML 形式のときだけ意味がある。巨大になるので試験本番では false。
# 一時的に有効化するには JMETER_SAVE_RESPONSE_DATA=true (jmeter-run が -J で渡す)
jmeter.save.saveservice.response_data=false
# 失敗したサンプルだけ本文を残す。原因調査と容量の折衷案として実用的
jmeter.save.saveservice.response_data.on_error=false
# 要求/応答ヘッダ、送信データ。デバッグ用。試験本番では false
jmeter.save.saveservice.requestHeaders=false
jmeter.save.saveservice.responseHeaders=false
jmeter.save.saveservice.samplerData=false
# アイドル時間 (タイマーの待ち時間)。ThinkTime を含めた見かけ上の応答を追うとき
jmeter.save.saveservice.idle_time=true
# サブサンプル (リダイレクト先や埋め込みリソース) を個別行として残す
jmeter.save.saveservice.subresults=true
# 実行ホスト名。分散実行 (複数の負荷生成機) のときに要る
jmeter.save.saveservice.hostname=false

# 出力の区切り文字。CSV なのでカンマ。変えると GUI 側の設定も合わせる必要がある
jmeter.save.saveservice.default_delimiter=,


# =============================================================================
# 2. 実行中の進捗表示 (summariser)
# ---------------------------------------------------------------------------
# 非 GUI 実行で「今どれだけ流れていて、どれだけ落ちているか」を定期的に出す。
# これが無いと、試験が終わるまで状況が分からない。
# =============================================================================
summariser.name=summary
# 出力間隔 (秒)。推奨: 短時間試験なら 10-30、長時間の耐久試験なら 60。
# 6 未満は無視される (JMeter の仕様)
summariser.interval=30
# 標準出力へ出す (jmeter-run が summary.log へ tee する)
summariser.out=true
# jmeter.log へも出す
summariser.log=true


# =============================================================================
# 3. HTML ダッシュボード (レポートジェネレータ)
# ---------------------------------------------------------------------------
# jmeter -e -o <dir> で生成される結果レポート。CSV 形式の jtl が前提。
# ここでの設定が、そのまま「合否の見え方」を決める。
# =============================================================================

# Apdex (Application Performance Index) の閾値。
#   satisfied  … この時間以内なら「満足」    (推奨: 画面系 500ms / API 200-300ms)
#   tolerated  … この時間以内なら「許容」    (推奨: satisfied の 4 倍が原則)
# Apdex = (満足数 + 許容数/2) / 総数。0.94 以上で Excellent、0.85 以上で Good が目安。
# ★実際の SLA/SLO に合わせて必ず調整すること。既定値のままの Apdex に意味は無い
jmeter.reportgenerator.apdex_satisfied_threshold=500
jmeter.reportgenerator.apdex_tolerated_threshold=2000

# 時系列グラフの粒度 (ミリ秒)。推奨: 試験時間 5 分なら 1000-5000、
# 1 時間超の耐久試験なら 15000-60000 (点が多すぎるとブラウザが重くなる)
jmeter.reportgenerator.overall_granularity=5000

# レポートに出すパーセンタイル。
# 平均だけを見ると必ず判断を誤る (外れ値が平均に埋もれる)。
# 推奨: 90 / 95 / 99 の 3 点。SLO は通常 95 か 99 パーセンタイルで定義する
aggregate_rpt_pct1=90
aggregate_rpt_pct2=95
aggregate_rpt_pct3=99

# レポートのタイトル (実行条件が分かる名前にしておくと後で助かる)
jmeter.reportgenerator.report_title=JMeter Load Test Report

# コントローラのサンプルをレポートから除外する (トランザクション単位で見たい場合は false)
jmeter.reportgenerator.exporter.html.series_filter=
jmeter.reportgenerator.exporter.html.filters_only_sample_series=true


# =============================================================================
# 4. HTTP クライアント (httpclient4) — 接続の扱い
# ---------------------------------------------------------------------------
# 「アプリが遅い」のか「負荷生成側のコネクション管理が下手」なのかを分ける設定。
# 実際のブラウザ/クライアントの挙動に寄せるのが原則。
# =============================================================================

# HTTP サンプラーの実装。HttpClient4 が既定かつ推奨 (接続プール・Keep-Alive が正しく効く)
jmeter.httpsampler=HttpClient4

# Keep-Alive したコネクションをプールに保持する時間 (ミリ秒)。
# 推奨: サーバ側の keepalive_timeout より短くする。
# nginx (alb) の既定は 75 秒、JBoss/Undertow の既定は 60 秒なので、ここでは 20 秒。
# これより長いと「サーバが閉じた後のコネクションを掴んで送る」= NoHttpResponseException の原因になる
httpclient4.idletimeout=20000

# プールから取り出したコネクションを、この時間以上アイドルなら再検証する (ミリ秒)。
# 推奨: 1000-2000。上の idletimeout と合わせて NoHttpResponseException を防ぐ要
httpclient4.validate_after_inactivity=1700

# コネクションの最大生存時間 (ミリ秒)。ALB の deregistration / スケールイン時に
# 古いコネクションを掴み続けないようにする。推奨: 60000
httpclient4.time_to_live=60000

# 失敗時の自動リトライ回数。
# ★性能試験では 0 を推奨★。リトライすると「失敗が成功として記録される」ため、
# エラー率と応答時間の両方が実態より良く見えてしまう
httpclient4.retrycount=0

# べき等でないリクエスト (POST 等) の再送を許可するか。false 推奨 (二重登録を防ぐ)
httpclient4.request_sent_retry_enabled=false

# スレッドグループの繰り返しごとに HTTP の状態 (コネクション/認証) を初期化するか。
#   true  … 毎回新規ユーザとして振る舞う (ログイン込みのシナリオで実態に近い)
#   false … コネクションを再利用し続ける (API 直叩きの限界性能を測るとき)
httpclient.reset_state_on_thread_group_iteration=true

# Keep-Alive を使う (HTTP Request Defaults 側の設定が優先)。
# ★実クライアントが Keep-Alive するなら true。毎回 TCP+TLS を張り直すと
#   ローカルポートを食い潰し、アプリではなく OS が先に詰まる
http.default.keepalive=true


# =============================================================================
# 5. TLS (HTTPS 対象を測るとき)
# ---------------------------------------------------------------------------
# alb-https / secure-api を対象にする場合に効く。自己証明書 (cacert.crt) は
# jmeter-run が keytool で /tmp のトラストストアへ取り込み、JVM 引数で渡す。
# =============================================================================

# 使用する TLS バージョン。実環境 (ALB) に合わせる。推奨: TLSv1.2 以上
https.default.protocol=TLSv1.2
https.socket.protocols=TLSv1.2 TLSv1.3

# SSL セッションを使い回すか。
#   false … スレッドごとに毎回フルハンドシェイク = TLS 処理の負荷を最大に見る
#   true  … セッション再開を使う (ブラウザの実態に近い。推奨)
https.use.cached.ssl.context=true

# クライアント証明書を使う場合のキーストア (このリポジトリの既定構成では未使用)
#javax.net.ssl.keyStore=/mnt/pki/client.p12
#javax.net.ssl.keyStoreType=PKCS12
#javax.net.ssl.keyStorePassword=changeit


# =============================================================================
# 6. DNS
# ---------------------------------------------------------------------------
# compose の内部 DNS は Docker のものだが、ALB を模した構成 (複数 IP への分散) を
# 測る場合は JVM の DNS キャッシュが結果を歪めることがある。
# =============================================================================
# JVM の DNS キャッシュ秒数 (-1 は永久キャッシュ)。ALB の IP 入れ替わりを追うなら 0-60
# (system.properties 相当。ここでは既定のままにしておく)
#networkaddress.cache.ttl=60


# =============================================================================
# 7. エンジンの挙動
# ---------------------------------------------------------------------------
# 試験の終わり方を安定させる設定。CI から回すときに効いてくる。
# =============================================================================

# 試験終了後、JVM を強制終了する。非 GUI 実行で「終わったのにプロセスが残る」
# (タイマーやキープアライブのスレッドが残るケース) を防ぐ。CI では true 推奨
jmeterengine.force.system.exit=true

# 停止要求を出してからスレッドの終了を待つ時間 (ミリ秒)。
# 応答の遅いサーバを相手にする試験では長めに (推奨: 5000-10000)
jmeterengine.threadstop.wait=5000

# 終了処理のポーリング間隔 (ミリ秒)
jmeter.exit.check.pause=2000

# CSV Data Set Config などで使う既定の文字コード
sampleresult.default.encoding=UTF-8

# 1 行にサンプル数 / エラー数の列を足すか。1 サンプル = 1 行の通常の試験では不要
jmeter.save.saveservice.sample_count=false

# 送信バイト数。アップロード系 (POST/PUT) の帯域を見るときに要る
jmeter.save.saveservice.sent_bytes=true


# =============================================================================
# 8. 負荷条件の既定値 (テスト計画が ${__P(...)} で参照する)
# ---------------------------------------------------------------------------
# compose の environment: (JMETER_THREADS 等) を指定すると jmeter-run が -J で
# 上書きするため、ここは「何も指定しなかったときの値」= 安全側の小さな値にする。
# 各項目の意味と推奨値は docs/JMETER-LOADTEST.md の「スレッドグループ」章を参照。
# =============================================================================

# 同時実行ユーザ数 (スレッド数)。1 コンテナあたりの目安は 200-300
threads=10
# 全スレッドを起動しきるまでの秒数。推奨: 最低でも threads と同じ秒数
# (10 スレッドなら 10 秒 = 毎秒 1 ユーザずつ増やす)。急に立ち上げると
# 測っているのが「アプリの性能」ではなく「同時接続の瞬間的な殺到」になる
rampup=10
# 試験時間 (秒)。ramp-up + 定常状態が含まれる。推奨: ramp-up + 実測したい時間
duration=300
# ループ回数。-1 = duration で終わるまで無限に回す (時間ベースの試験では -1)
loops=-1
# 起動遅延 (秒)。複数スレッドグループをずらして開始するときに使う
startup.delay=0
# ThinkTime (ミリ秒)。base + 0..range のランダム待ち。
# 画面遷移を模すなら 1000-5000、API の限界性能を測るなら 0
think.time.base=500
think.time.range=1000
# 接続タイムアウト / 応答タイムアウト (ミリ秒)。
# ★無制限 (0) にしないこと★。詰まったときに全スレッドが待ちに入り、
# 「遅い」のか「返っていない」のかが結果から読めなくなる
connect.timeout=5000
response.timeout=30000
# Constant Throughput Timer 用 (1 分あたりのサンプル数)。サンプル計画では既定で無効
throughput.per.min=600
