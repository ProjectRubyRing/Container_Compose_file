# -----------------------------------------------------------------------------
# HTTPS リスナー (:443) のリスナールール (★差し替え可能★)
# -----------------------------------------------------------------------------
#   /secure/*  → secure-api (HTTPS ターゲットグループ / 再暗号化)
#   /async/*   → app-back   (HTTP ターゲットグループ / ALB で TLS 終端)
#   /          → app-back   (同上)
#
# 実 ALB との対応:
#   - /secure/* は「ターゲットグループのプロトコル = HTTPS」のケース。
#     ALB はクライアントとの TLS を終端し、ターゲットへは別途 TLS を張り直す。
#     このとき ALB はターゲット証明書の検証を行わないが、nginx では検証の有無を
#     proxy_ssl_verify で選べるため、既定では検証を有効 (on) にして
#     「CA を信頼していれば検証が通る」ことも同時に確認できるようにしている。
#   - /async/*, / は「ターゲットグループのプロトコル = HTTP」のケース (TLS 終端)。
#
# ★nginx の注意点★
#   proxy_set_header は「同じ階層で 1 つでも書くと、上位階層の指定を全て捨てて
#   その location のものだけ有効になる」。そのため /secure/ では nginx.conf の
#   server ブロックと同じヘッダを明示的に再掲している。
#   /async/, / はヘッダを書かないことで server ブロックの指定をそのまま継承する。
# -----------------------------------------------------------------------------

# --- HTTPS ターゲットグループ (secure-api) への転送 ---------------------------
# 末尾スラッシュつき proxy_pass のため /secure/v1/ping → https://secure-api:8443/api/v1/ping
location /secure/ {
    proxy_pass https://secure_api/api/;

    # SNI にサーバ名を載せる (secure-api の証明書 SAN と一致させるため必須)
    proxy_ssl_server_name on;
    proxy_ssl_name        secure-api;

    # ターゲット証明書の検証。トラストアンカーは自己証明書 cacert.crt 1 枚
    # (secure-api のサーバ証明書はこれが発行している)。
    # 実 ALB はここを検証しないので、挙動を完全に合わせたい場合は off にする
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        2;
    proxy_ssl_trusted_certificate /pki/ca/cacert.crt;
    proxy_ssl_protocols           TLSv1.2 TLSv1.3;
    proxy_ssl_session_reuse       on;

    # server ブロックと同じヘッダ群 (上記★の理由で再掲が必要)
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto "https";
    proxy_set_header X-Forwarded-Port  "443";
    # どちらの経路を通ったかを検証しやすくするマーカー
    proxy_set_header X-ALB-Route       "https-listener->secure-api";
}

# --- HTTP ターゲットグループ (app-back) への転送 (ALB で TLS 終端) ------------
# proxy_set_header を書かない = server ブロックのヘッダ指定をそのまま継承する
location /async/ {
    proxy_pass http://app_back;
}

location / {
    proxy_pass http://app_back;
}
