# -----------------------------------------------------------------------------
# ALB HTTPS リスナーのサーバ証明書 (★差し替え可能な切り替えファイル★)
# 現在: 自己署名証明書 (selfsigned)
# -----------------------------------------------------------------------------
# 実 AWS では ACM の証明書をリスナーにアタッチする部分に相当する。
# 切り替えは ./alb-tls-cert.sh selfsigned|ca-issued
# (compose/alb/tls/variants/ の該当ファイルをこのファイルへコピーして nginx -s reload)。
#
# 自前の証明書を使う場合は、証明書と鍵を alb コンテナから見えるパスへ置き
# (例: compose.yaml に ./mycerts:/etc/nginx/mycerts:ro を追加)、
# 下記 2 行のパスを書き換えて `docker compose exec alb nginx -s reload`。
#
# ここで指定している /pki/... は pki-init が named volume (pki) に発行したもの:
#   /pki/alb/selfsigned/fullchain.crt  自己署名リーフ (チェーン 1 枚)
#   /pki/alb/ca-issued/fullchain.crt   中間 CA 発行 (リーフ + 中間 CA)
# -----------------------------------------------------------------------------
ssl_certificate     /pki/alb/selfsigned/fullchain.crt;
ssl_certificate_key /pki/alb/selfsigned/server.key;
