# -----------------------------------------------------------------------------
# ALB HTTPS リスナー証明書: CA 発行パターン (ACM 発行 / インポート相当)
# -----------------------------------------------------------------------------
# 自己証明書 (自己署名 CA = cacert.crt) が発行したサーバ証明書を ALB に適用する。
# クライアント (front/back の JVM) 側は「cacert.crt」をトラストストアへ
# インポートしていれば、この証明書を検証できる
# (= 証明書を入れ替えても CA が同じならトラストストアの更新は不要)。
#
# fullchain.crt はリーフ + cacert。ALB でも証明書チェーンを添えるのと同じ考え方で、
# クライアントが cacert を持っていない場合でもチェーンの形が確認できる。
# -----------------------------------------------------------------------------
ssl_certificate     /pki/alb/ca-issued/fullchain.crt;
ssl_certificate_key /pki/alb/ca-issued/server.key;
