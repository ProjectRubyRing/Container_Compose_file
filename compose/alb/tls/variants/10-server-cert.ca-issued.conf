# -----------------------------------------------------------------------------
# ALB HTTPS リスナー証明書: 中間 CA 発行パターン (ACM 発行 / インポート相当)
# -----------------------------------------------------------------------------
# プライベート CA (ルート CA → 中間 CA) が発行したサーバ証明書を ALB に適用する。
# クライアント (front/back の JVM) 側は「中間 CA (+ ルート CA) 証明書」を
# トラストストアへインポートしていれば、この証明書を検証できる
# (= 証明書を入れ替えても CA が同じならトラストストアの更新は不要)。
#
# fullchain.crt はリーフ + 中間 CA。ALB でも証明書チェーン (中間証明書) を
# 添えるのと同じで、これが無いとクライアントはチェーンを構築できない。
# -----------------------------------------------------------------------------
ssl_certificate     /pki/alb/ca-issued/fullchain.crt;
ssl_certificate_key /pki/alb/ca-issued/server.key;
