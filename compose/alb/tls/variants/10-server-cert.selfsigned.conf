# -----------------------------------------------------------------------------
# ALB HTTPS リスナー証明書: 自己署名証明書パターン
# -----------------------------------------------------------------------------
# CA を介さずに発行した自己署名リーフ証明書をそのまま ALB に適用する。
# クライアント (front/back の JVM) 側は「この証明書 1 枚」をトラストストアへ
# インポートしないと検証できない (trust/alb-selfsigned.crt がそれ)。
# cacert.crt を信頼していてもこの証明書は検証できない点が CA 発行パターンとの違い。
# -----------------------------------------------------------------------------
ssl_certificate     /pki/alb/selfsigned/fullchain.crt;
ssl_certificate_key /pki/alb/selfsigned/server.key;
