# =============================================================================
# nginx 設定 — Application Load Balancer (ALB) のローカル代替
# ---------------------------------------------------------------------------
# 実 AWS では:
#   Lambda → ALB (リスナー :80) → リスナールール (パス条件) → ターゲットグループ
#          → backend (ECS の app-back コンテナ, 8180) または Lambda ターゲット (メンテナンス画面)
#   frontend/backend → ALB (HTTPS リスナー :443) → ターゲットグループ
#          → secure-api (HTTPS 再暗号化) または backend (TLS 終端)
# の経路をたどる。nginx でこの L7 ルーティングを模擬する。
#
#   upstream app_back              = ターゲットグループ (backend:8180)
#   upstream secure_api            = HTTPS ターゲットグループ (secure-api:8443)
#   upstream maint_adapter         = Lambda ターゲット (メンテナンス Lambda を
#                                    alb-lambda-adapter 経由で呼ぶ)
#   listen 80                      = ALB リスナー (HTTP :80)
#   listen 443 ssl                 = ALB リスナー (HTTPS :443, ACM 証明書相当)
#   include /etc/nginx/rules/*.conf = リスナールール群 (★差し替え可能★)
#   proxy_set_header X-Forwarded-* = ALB が付与するヘッダの再現 (server 継承)
#
# ★このファイルが担うのは ALB の「L7 ルーティング」だけで、もう一つの仕事である
#   「ターゲットグループのヘルスチェック」は含まない (nginx の upstream の
#   max_fails / fail_timeout は ALB のヘルスチェックとは別物)。ALB がターゲットへ
#   外から投げるヘルスチェックは alb-healthcheck サービスが偽装する。
#   詳細は docs/ALB-HEALTHCHECK.md を参照。
#
# ★リスナールールの切り替え:
#   ルールは compose/alb/rules/*.conf に分離してある (このファイルは触らない)。
#   全面メンテナンス ON/OFF は ./alb-maintenance.sh on|off で
#   rules/10-routes.conf を差し替えて nginx -s reload する。
#   詳細は docs/ASYNC-SQS-LAMBDA-ALB.md の「メンテナンス」節を参照。
#
# ★HTTPS リスナーの証明書の切り替え:
#   証明書指定は compose/alb/tls/10-server-cert.conf に分離してある。
#   ./alb-tls-cert.sh selfsigned|ca-issued で tls/variants/ の内容を
#   差し替えて nginx -s reload する。詳細は docs/TLS-SELF-SIGNED-ALB.md を参照。
# =============================================================================

worker_processes 1;
events { worker_connections 256; }

http {
    log_format alb '$remote_addr -> $upstream_addr "$request" '
                   'status=$status upstream_status=$upstream_status '
                   'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout alb;
    error_log  /dev/stderr warn;

    # --- ターゲットグループ (backend) ---------------------------------------
    # backend (ECS の app-back コンテナ) は port-offset=100 のため HTTP は 8180。
    upstream app_back {
        server backend:8180 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # --- Lambda ターゲット (メンテナンス Lambda) -----------------------------
    # 実 ALB の「Lambda ターゲット統合」を alb-lambda-adapter が肩代わりする。
    upstream maint_adapter {
        server alb-lambda-adapter:8080 max_fails=3 fail_timeout=10s;
        keepalive 8;
    }

    # --- HTTPS ターゲットグループ (secure-api) -------------------------------
    # 実 ALB で「ターゲットグループのプロトコル = HTTPS」にした場合に相当する。
    # ALB はクライアント側の TLS を終端したうえで、ターゲットへは新たに TLS を
    # 張り直す (再暗号化)。nginx 側は proxy_pass https:// + proxy_ssl_* で再現する。
    upstream secure_api {
        server secure-api:8443 max_fails=3 fail_timeout=10s;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        # ALB のアイドルタイムアウト相当
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # ALB が付与する標準ヘッダの再現 (各 location に継承される)
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  "80";

        # --- ALB 自体のヘルスチェック用 (nginx が生きているか) ---------------
        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "alb-ok\n";
        }

        # --- リスナールール群 (★差し替え可能★) ------------------------------
        # 常時有効: 00-maintenance-path.conf (/maintenance* → メンテナンス Lambda)
        # 切り替え : 10-routes.conf (通常 = backend / 全面メンテ = メンテナンス Lambda)
        include /etc/nginx/rules/*.conf;
    }

    # =========================================================================
    # ALB の HTTPS リスナー (:443) — ACM 証明書を適用したリスナーの代替
    # -------------------------------------------------------------------------
    # 実 AWS:  クライアント → [ALB:443 (ACM 証明書で TLS 終端)] → ターゲットグループ
    #          ターゲットグループのプロトコルが HTTPS なら ALB → ターゲットも TLS。
    # ここでは:
    #   証明書   = /etc/nginx/tls/*.conf で指定 (★差し替え可能★ / alb-tls-cert.sh)
    #   ルール   = /etc/nginx/rules-tls/*.conf (★差し替え可能★)
    # =========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # --- サーバ証明書 (★差し替え可能★) ----------------------------------
        # 既定は pki-init が発行した ALB 用証明書 (自己署名 / 中間 CA 発行を切替可)。
        # 自前の証明書を使う場合はこのファイルの ssl_certificate を書き換える。
        include /etc/nginx/tls/*.conf;

        # ALB の定義済みセキュリティポリシー (ELBSecurityPolicy-TLS13-1-2-2021-06)
        # がサポートするプロトコル範囲に合わせる
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:5m;
        ssl_session_timeout 10m;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # ALB が付与する標準ヘッダの再現。HTTPS リスナーなので proto/port は https/443
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Port  "443";

        # --- ALB 自体のヘルスチェック用 --------------------------------------
        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "alb-tls-ok\n";
        }

        # --- HTTPS リスナーのリスナールール群 (★差し替え可能★) --------------
        include /etc/nginx/rules-tls/*.conf;
    }
}
